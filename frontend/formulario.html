<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario producto · StockFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Stock<span>Flow</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="formulario.html?id=">Nuevo producto</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card p-4">
        <h1 class="h4 mb-3" id="titulo-formulario">Nuevo producto</h1>

        <form id="form-producto" novalidate>
          <div class="mb-3">
            <label class="form-label" for="campo-nombre">Nombre</label>
            <input type="text" id="campo-nombre" class="form-control"
                   maxlength="120" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>

          <div class="row">
            <div class="col-md-7 mb-3">
              <label class="form-label" for="campo-sku">SKU</label>
              <input type="text" id="campo-sku" class="form-control"
                     maxlength="20" placeholder="SKU-0000-XX" required>
              <div class="invalid-feedback">El SKU es obligatorio y debe ser único.</div>
            </div>
            <div class="col-md-5 mb-3">
              <label class="form-label" for="campo-categoria">Categoría</label>
              <select id="campo-categoria" class="form-select" required>
                <option value="">Seleccione...</option>
              </select>
              <div class="invalid-feedback">Debe elegir una categoría.</div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label" for="campo-precio">Precio ($)</label>
              <input type="number" id="campo-precio" class="form-control"
                     min="0" step="0.01" required>
              <div class="invalid-feedback">Precio inválido.</div>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label" for="campo-stock">Stock</label>
              <input type="number" id="campo-stock" class="form-control"
                     min="0" value="0" required>
              <div class="invalid-feedback">Stock inválido.</div>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label" for="campo-stock-minimo">Stock mínimo</label>
              <input type="number" id="campo-stock-minimo" class="form-control"
                     min="0" value="5" required>
              <div class="invalid-feedback">Valor inválido.</div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="campo-unidad">Unidad de medida</label>
              <select id="campo-unidad" class="form-select">
                <option value="UN">Unidad</option>
                <option value="KG">Kilogramo</option>
                <option value="LT">Litro</option>
                <option value="PAQ">Paquete</option>
              </select>
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="campo-activo" checked>
                <label class="form-check-label" for="campo-activo">Producto activo</label>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-dark">Guardar</button>
            <a href="productos.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="text-center text-muted small pb-4">
  StockFlow · Frontend estático (prototipo para conectar con Django)
</footer>

<script src="js/datos.js"></script>
<script src="js/formulario.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
