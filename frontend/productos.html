<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · StockFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Stock<span>Flow</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="formulario.html">Nuevo producto</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Productos</h1>
    <a href="formulario.html" class="btn btn-dark">+ Nuevo producto</a>
  </div>

  <div id="alerta-contenedor"></div>

  <form id="form-filtros" class="row g-2 mb-3">
    <div class="col-md-5">
      <input type="text" name="q" id="input-q" class="form-control"
             placeholder="Buscar por nombre o SKU...">
    </div>
    <div class="col-md-4">
      <select name="categoria" id="select-categoria" class="form-select">
        <option value="">Todas las categorías</option>
      </select>
    </div>
    <div class="col-md-3 d-grid">
      <button type="submit" class="btn btn-outline-dark">Filtrar</button>
    </div>
  </form>

  <div class="table-responsive card p-3">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>SKU</th><th>Nombre</th><th>Categoría</th>
          <th>Precio</th><th>Stock</th><th>Estado</th><th></th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </div>
</main>

<footer class="text-center text-muted small pb-4">
  StockFlow · Frontend estático (prototipo para conectar con Django)
</footer>

<script src="js/datos.js"></script>
<script src="js/productos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
